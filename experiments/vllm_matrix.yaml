# vLLM TTFT experiment matrix.
#
# GENERATED by rca_engine/scripts/gen_vllm_matrix.py from
# workload/scenarios.py. Edit the scenario library, not this file.
#
# 12 scenarios, 5 repeats each (8 for the
# clean control, since a false-positive rate needs more samples than
# top-1 accuracy does).
#
# Total: 63 runs x ~360s = ~6.3h

defaults:
  baseline_seconds: 120
  fault_seconds: 180
  settle_seconds: 60
  domain: vllm

experiments:
  - scenario: qps_ramp
    kind: workload
    repeats: 5
    root_cause: kv_cache_pressure
    expect_verdict: capacity
    requires_gpu: false

  - scenario: long_prompt_burst
    kind: workload
    repeats: 5
    root_cause: prefill_cost
    expect_verdict: capacity
    requires_gpu: false

  - scenario: long_output_burst
    kind: workload
    repeats: 5
    root_cause: kv_cache_pressure
    expect_verdict: capacity
    requires_gpu: false

  - scenario: prefix_diversity
    kind: workload
    repeats: 5
    root_cause: prefix_cache_efficacy
    expect_verdict: pathology
    requires_gpu: false

  - scenario: bimodal_mix
    kind: workload
    repeats: 5
    root_cause: batch_composition
    expect_verdict: capacity
    requires_gpu: false

  - scenario: kv_cache_starved
    kind: config
    repeats: 5
    root_cause: kv_cache_pressure
    expect_verdict: pathology
    requires_gpu: false
    server_args: ['--kv-cache-memory-bytes=268435456']

  - scenario: queue_starved
    kind: config
    repeats: 5
    root_cause: queueing
    expect_verdict: pathology
    requires_gpu: false
    server_args: ['--max-num-seqs=4']

  - scenario: chunked_prefill_off
    kind: config
    repeats: 5
    root_cause: batch_composition
    expect_verdict: pathology
    requires_gpu: false
    server_args: ['--no-enable-chunked-prefill']

  - scenario: prefix_cache_off
    kind: config
    repeats: 5
    root_cause: prefix_cache_efficacy
    expect_verdict: pathology
    requires_gpu: false
    server_args: ['--no-enable-prefix-caching']

  - scenario: block_size_mismatch
    kind: config
    repeats: 5
    root_cause: kv_cache_pressure
    expect_verdict: pathology
    requires_gpu: false
    server_args: ['--block-size=32']

  - scenario: host_cpu_hog
    kind: infra
    repeats: 5
    root_cause: host_saturation
    expect_verdict: pathology
    requires_gpu: false
    infra_fault: cpu_hog

  - scenario: clean
    kind: workload
    repeats: 8
    root_cause: null
    expect_verdict: no_anomaly
    requires_gpu: false
