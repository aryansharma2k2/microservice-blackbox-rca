name: tests and accuracy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/ -q

      # The domain's metric names are a hypothesis until something checks them
      # against a real server. The committed surface is that check, captured
      # from vllm/vllm-openai-cpu serving Qwen3-0.6B.
      - name: Metric surface has not drifted
        run: |
          python -m rca_engine.scripts.discover_metrics check vllm \
            --surface deploy/vllm/metric_surface.json

      - name: Experiment matrix is generated, not hand-edited
        run: python -m rca_engine.scripts.gen_vllm_matrix --check

      # Re-derive accuracy from the committed traces. No server, no GPU.
      # An RCA project whose CI asserts its own diagnostic accuracy.
      # Floors are REGRESSION GUARDS derived from the measured corpus, not
      # aspirations. Measured on 38 GPU runs: top-1 39.5%, false positives 0%
      # over 8 clean runs. One run flipping is ~2.6 points, so 0.35 leaves
      # roughly one-and-a-half runs of headroom before CI trips on noise.
      #
      # The FPR ceiling guards the pipeline's strongest property — staying
      # quiet when nothing is wrong. A change that starts naming causes on
      # clean runs is a real regression even if top-1 improves.
      - name: Diagnostic accuracy has not regressed
        run: |
          python -m eval.run_eval traces/vllm --detail \
            --min-runs 20 --min-top1 0.35 --max-fpr 0.10
