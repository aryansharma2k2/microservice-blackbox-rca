[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-blackbox-rca"
version = "0.1.0"
description = "Black-box root-cause analysis over Prometheus telemetry, for microservices and LLM inference engines."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyarrow>=14.0",      # required by DataFrame.to_parquet for run artifacts
    "requests>=2.31,<3",
    "matplotlib>=3.7,<4",
    "pyyaml>=6.0,<7",
    "click>=8.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Needed only for the LLM-only baseline and the explainer stage. The
# statistical pipeline and every other baseline run without them, and
# cached LLM responses replay without an API key.
llm = [
    "anthropic>=0.116",
    "pydantic>=2.0",
]

[project.scripts]
rca = "rca_engine.__main__:main"

[tool.setuptools]
# Flat layout with several top-level packages; list them explicitly so
# setuptools does not try to auto-discover and fail on the non-package dirs
# (checkpoints/, experiments/, portfolio/, docs/, paper/).
packages = [
    "rca_engine",
    "rca_engine.scripts",
    "eval",
    "fault_injection",
    "infra",
    "calibration",
    "workload",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
