# vLLM + Prometheus for TTFT root-cause experiments.
#
# Two profiles, because the fault library is developed locally on CPU and
# captured for real on a rented GPU:
#
#   docker compose --profile cpu up      # local wiring checks, tiny model
#   docker compose --profile gpu up      # trace capture, realistic dynamics
#
# The CPU backend runs the same scheduler, so queueing, preemption, and cache
# accounting are all real — only the absolute latencies are distorted, since
# the KV cache lives in host RAM. Good enough to validate that every metric
# resolves and every fault scenario perturbs the component it claims to.
# Not good enough to draw conclusions from.

services:
  vllm-cpu:
    profiles: ["cpu"]
    # Apple Silicon needs -arm64; x86 hosts want -x86_64, which additionally
    # assumes avx512f support.
    image: ${VLLM_CPU_IMAGE:-vllm/vllm-openai-cpu:latest-arm64}
    # The image entrypoint is ["vllm", "serve"] and the model is positional.
    # Overridden to a shell so ${VLLM_EXTRA_ARGS} can expand to zero or many
    # flags — that is how config-kind scenarios restart the server degraded.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec vllm serve ${MODEL:-Qwen/Qwen3-0.6B}
        --host 0.0.0.0
        --port 8000
        --max-model-len ${MAX_MODEL_LEN:-4096}
        --max-num-seqs ${MAX_NUM_SEQS:-16}
        ${VLLM_EXTRA_ARGS:-}
    ports:
      - "8000:8000"
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      # KV cache size for the CPU backend, in GiB. The CPU equivalent of
      # --gpu-memory-utilization; keep it small so cache pressure is reachable.
      - VLLM_CPU_KVCACHE_SPACE=${CPU_KVCACHE_GB:-2}
    # vLLM's engine core needs ~160 MiB of shared memory for its ring buffer.
    # Docker's 64 MiB default is not enough, and `ipc: host` does not help on
    # Docker Desktop, where the daemon runs inside a VM.
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  vllm-gpu:
    profiles: ["gpu"]
    image: ${VLLM_GPU_IMAGE:-vllm/vllm-openai:v0.11.0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec vllm serve ${MODEL:-Qwen/Qwen2.5-7B-Instruct}
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization ${GPU_MEM_UTIL:-0.90}
        --max-model-len ${MAX_MODEL_LEN:-8192}
        ${VLLM_EXTRA_ARGS:-}
    ports:
      - "8000:8000"
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # GPU-side signals for the `gpu_saturation` component. Absent under the cpu
  # profile, which is fine: that component simply never goes abnormal there.
  dcgm-exporter:
    profiles: ["gpu"]
    image: nvidia/dcgm-exporter:4.1.1-4.0.4-ubuntu22.04
    ports:
      - "9400:9400"
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Container-level CPU for the `host_saturation` component. The API server,
  # tokenizer, and detokenizer run on CPU; starving them spikes TTFT while the
  # KV cache sits idle, which is the confounder the whole project turns on.
  # Without this exporter that component has no data and never fires.
  cadvisor:
    profiles: ["cpu", "gpu"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --housekeeping_interval=1s
      - --docker_only=true
    ports:
      - "8080:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # Mounted explicitly: on Docker Desktop the /var/run bind above does not
      # expose the daemon socket, so container discovery silently fails and
      # cAdvisor reports only the root cgroup.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    profiles: ["cpu", "gpu"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Experiments are minutes long and scraped at 1s; a short retention
      # keeps the container small.
      - --storage.tsdb.retention.time=6h
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

volumes:
  prom-data:
