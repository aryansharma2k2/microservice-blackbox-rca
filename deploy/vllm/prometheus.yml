# 1s scrape, matching the Boutique posture in infra/prometheus-values.yaml.
#
# A 120s fault window at 1s gives ~120 samples per series, which is what CUSUM
# and the FFT burst filter need to separate a sustained shift from noise. The
# vLLM engine updates its metrics once per scheduler step, so at realistic
# batch sizes 1s is not oversampling.
global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 900ms

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm-cpu:8000", "vllm-gpu:8000"]
    metrics_path: /metrics
    # Only one of the two is up depending on the active profile; the other
    # target stays down and is ignored.
    honor_labels: true

  # Container CPU/throttle for the vLLM container, backing `host_saturation`.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
    metrics_path: /metrics
